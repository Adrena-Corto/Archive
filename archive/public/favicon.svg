<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
  <text x="16" y="22" text-anchor="middle" font-family="Noto Sans Cuneiform, sans-serif" font-size="14" fill="#22d3ee" filter="url(#glow)">𒃸𒁀</text>
</svg>
