<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🌙 DreamLog</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0a0a0f;
  color: #d4d0c8;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
}

.app { max-width: 500px; margin: 0 auto; }

/* CAPTURE */
.capture {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 1rem;
  padding-top: max(1rem, env(safe-area-inset-top));
}
.capture-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.8rem;
}
.capture-header h1 { font-size: 1.2rem; color: #8b7ec8; font-weight: 600; }
.time-badge {
  font-size: 0.75rem; color: #6b6580;
  background: rgba(139,126,200,0.1);
  padding: 0.25rem 0.6rem; border-radius: 12px;
}

textarea#dream-input {
  flex: 1; width: 100%;
  background: #12121a; border: 1px solid #2a2840; border-radius: 12px;
  color: #e0dcd4; font-size: 1.05rem; line-height: 1.6;
  padding: 1rem; resize: none; outline: none; font-family: inherit;
}
textarea#dream-input::placeholder { color: #3a3650; }
textarea#dream-input:focus { border-color: #8b7ec8; }

.quick-options {
  display: flex; gap: 0.5rem; margin-top: 0.8rem;
  flex-wrap: wrap; align-items: center;
}
.pill {
  padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem;
  border: 1px solid #2a2840; background: transparent; color: #8b8598;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.pill.active { background: #8b7ec8; color: #0a0a0f; border-color: #8b7ec8; }
.pill:active { transform: scale(0.95); }

.vividness-row {
  display: flex; align-items: center; gap: 0.3rem; margin-left: auto;
}
.vividness-row span { font-size: 0.75rem; color: #6b6580; }
.viv-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid #2a2840; background: transparent;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.viv-dot.active { background: #8b7ec8; border-color: #8b7ec8; }

.supps-row { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
.supp-pill {
  padding: 0.3rem 0.6rem; border-radius: 16px; font-size: 0.7rem;
  border: 1px solid #2a2840; background: transparent; color: #6b6580;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.supp-pill.active { background: #3c5a3c; color: #8bc88b; border-color: #3c5a3c; }

.tags-input { margin-top: 0.5rem; }
.tags-input input {
  width: 100%; background: #12121a; border: 1px solid #2a2840; border-radius: 8px;
  color: #e0dcd4; font-size: 0.85rem; padding: 0.5rem 0.8rem;
  outline: none; font-family: inherit;
}
.tags-input input::placeholder { color: #3a3650; }
.tags-input input:focus { border-color: #8b7ec8; }

.save-row { margin-top: 0.8rem; display: flex; gap: 0.5rem; }
#save-btn {
  flex: 1; padding: 0.9rem; background: #8b7ec8; color: #0a0a0f;
  border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
#save-btn:active { transform: scale(0.98); background: #7a6db8; }
#save-btn:disabled { opacity: 0.3; }
.nav-btn {
  padding: 0.9rem 1.2rem; background: #1a1a25; color: #8b8598;
  border: 1px solid #2a2840; border-radius: 12px; font-size: 1rem;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
#voice-btn {
  padding: 0.9rem 1.2rem; background: #1a1a25; border: 1px solid #2a2840;
  border-radius: 12px; font-size: 1.1rem; cursor: pointer; color: #8b8598;
  -webkit-tap-highlight-color: transparent;
}
#voice-btn.recording { background: #c8463c; border-color: #c8463c; color: white; }

/* TIMELINE */
.timeline {
  display: none; padding: 1rem;
  padding-top: max(1rem, env(safe-area-inset-top));
  padding-bottom: 5rem; max-width: 500px; margin: 0 auto;
}
.timeline-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 1rem;
}
.timeline-header h2 { font-size: 1.1rem; color: #8b7ec8; }

.stats-bar { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat-box {
  background: #12121a; border: 1px solid #2a2840; border-radius: 10px;
  padding: 0.6rem 0.8rem; flex: 1; min-width: 65px;
}
.stat-num { font-size: 1.3rem; color: #8b7ec8; font-weight: 700; }
.stat-label { font-size: 0.65rem; color: #6b6580; margin-top: 0.1rem; }

.dream-card {
  background: #12121a; border: 1px solid #2a2840; border-radius: 10px;
  padding: 0.8rem 1rem; margin-bottom: 0.6rem;
}
.dream-date {
  font-size: 0.7rem; color: #6b6580; margin-bottom: 0.3rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.lucid-badge {
  background: #8b7ec8; color: #0a0a0f; padding: 0.1rem 0.4rem;
  border-radius: 8px; font-size: 0.6rem; font-weight: 600;
}
.fragment-badge {
  background: #3c4a5a; color: #8bacc8; padding: 0.1rem 0.4rem;
  border-radius: 8px; font-size: 0.6rem;
}
.viv-badge { background: #2a2840; color: #8b7ec8; padding: 0.1rem 0.4rem; border-radius: 8px; font-size: 0.6rem; }
.dream-text { font-size: 0.9rem; color: #d4d0c8; line-height: 1.5; white-space: pre-wrap; }
.dream-tags { margin-top: 0.4rem; font-size: 0.7rem; color: #8b7ec8; }
.dream-supps { margin-top: 0.2rem; font-size: 0.65rem; color: #6b9b6b; }
.dream-actions { margin-top: 0.5rem; display: flex; gap: 0.8rem; }
.dream-actions button {
  background: none; border: none; color: #4a4660; font-size: 0.75rem;
  cursor: pointer; padding: 0.2rem 0;
}
.dream-actions button:hover { color: #8b7ec8; }
.dream-actions .delete-btn:hover { color: #c8463c; }

.export-row { margin-top: 1.5rem; text-align: center; }
.export-btn {
  padding: 0.5rem 1.2rem; background: #1a1a25; color: #6b6580;
  border: 1px solid #2a2840; border-radius: 8px; font-size: 0.75rem;
  cursor: pointer;
}

.toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #8b7ec8; color: #0a0a0f;
  padding: 0.6rem 1.5rem; border-radius: 20px;
  font-size: 0.85rem; font-weight: 600;
  transition: transform 0.3s ease; z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

<!-- CAPTURE -->
<div class="capture" id="capture-view">
  <div class="capture-header">
    <h1>🌙 DreamLog</h1>
    <span class="time-badge" id="time-badge"></span>
  </div>
  <textarea id="dream-input" placeholder="What did you see..." autofocus></textarea>
  <div class="quick-options">
    <button class="pill" data-type="dream" onclick="setType(this)">Dream</button>
    <button class="pill" data-type="fragment" onclick="setType(this)">Fragment</button>
    <button class="pill" data-type="lucid" onclick="setType(this)">Lucid ✨</button>
    <div class="vividness-row">
      <span>Vivid</span>
      <button class="viv-dot" data-v="1" onclick="setViv(1)"></button>
      <button class="viv-dot" data-v="2" onclick="setViv(2)"></button>
      <button class="viv-dot" data-v="3" onclick="setViv(3)"></button>
      <button class="viv-dot" data-v="4" onclick="setViv(4)"></button>
      <button class="viv-dot" data-v="5" onclick="setViv(5)"></button>
    </div>
  </div>
  <div class="supps-row">
    <button class="supp-pill" data-s="tryptophan" onclick="toggleSupp(this)">Tryptophan</button>
    <button class="supp-pill" data-s="b6" onclick="toggleSupp(this)">B6</button>
    <button class="supp-pill" data-s="huperzine" onclick="toggleSupp(this)">Huperzine A</button>
    <button class="supp-pill" data-s="alpha-gpc" onclick="toggleSupp(this)">Alpha GPC</button>
    <button class="supp-pill" data-s="galantamine" onclick="toggleSupp(this)">Galantamine</button>
  </div>
  <div class="tags-input">
    <input id="tags-input" placeholder="Tags (comma separated)..." />
  </div>
  <div class="save-row">
    <button id="voice-btn" onclick="toggleVoice()">🎙️</button>
    <button id="save-btn" onclick="saveDream()">Save</button>
    <button class="nav-btn" onclick="showTimeline()">📋</button>
  </div>
</div>

<!-- TIMELINE -->
<div class="timeline" id="timeline-view">
  <div class="timeline-header">
    <h2>📋 Journal</h2>
    <button class="nav-btn" onclick="showCapture()">+ New</button>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div id="dream-list"></div>
  <div class="export-row">
    <button class="export-btn" onclick="exportJSON()">Export JSON</button>
  </div>
</div>

</div>
<div class="toast" id="toast">Saved 🌙</div>

<script>
// All data in localStorage
const STORE_KEY = 'dreamlog_dreams';
let dreamType = 'dream';
let vividness = 0;
let activeSupps = new Set();
let recognition = null;
let isRecording = false;

function getDreams() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch { return []; }
}
function saveDreams(dreams) {
  localStorage.setItem(STORE_KEY, JSON.stringify(dreams));
}

// Time
function updateTime() {
  const now = new Date();
  const h = now.getHours();
  let p = '🌙';
  if (h>=6&&h<12) p='🌅'; else if (h>=12&&h<18) p='☀️'; else if (h>=18&&h<22) p='🌆';
  document.getElementById('time-badge').textContent = p+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
updateTime(); setInterval(updateTime, 60000);

function setType(el) {
  document.querySelectorAll('.pill[data-type]').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  dreamType = el.dataset.type;
}
function setViv(v) {
  vividness = v;
  document.querySelectorAll('.viv-dot').forEach(d=>d.classList.toggle('active', parseInt(d.dataset.v)<=v));
}
function toggleSupp(el) {
  el.classList.toggle('active');
  if (el.classList.contains('active')) activeSupps.add(el.dataset.s);
  else activeSupps.delete(el.dataset.s);
}

// Voice
function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { toast('Voice not supported'); return; }
  const btn = document.getElementById('voice-btn');
  if (isRecording) { recognition.stop(); btn.classList.remove('recording'); btn.textContent='🎙️'; isRecording=false; return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'fr-FR';
  const input = document.getElementById('dream-input');
  const startLen = input.value.length;
  recognition.onresult = (e) => {
    let t=''; for (let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
    input.value = input.value.substring(0,startLen)+(startLen>0?' ':'')+t;
  };
  recognition.onerror = recognition.onend = () => { btn.classList.remove('recording'); btn.textContent='🎙️'; isRecording=false; };
  recognition.start(); btn.classList.add('recording'); btn.textContent='⏹️'; isRecording=true;
}

// Save
function saveDream() {
  const content = document.getElementById('dream-input').value.trim();
  if (!content) return;
  const dreams = getDreams();
  dreams.unshift({
    id: Date.now(),
    created_at: new Date().toISOString(),
    content,
    tags: document.getElementById('tags-input').value.trim(),
    dream_type: dreamType==='lucid'?'dream':dreamType,
    lucid: dreamType==='lucid',
    vividness,
    supplements: [...activeSupps].join(','),
  });
  saveDreams(dreams);
  toast('Saved 🌙');
  document.getElementById('dream-input').value='';
  document.getElementById('tags-input').value='';
  vividness=0;
  document.querySelectorAll('.viv-dot').forEach(d=>d.classList.remove('active'));
}

// Timeline
function showTimeline() {
  document.getElementById('capture-view').style.display='none';
  document.getElementById('timeline-view').style.display='block';
  const dreams = getDreams();
  
  // Stats
  const total = dreams.length;
  const lucid = dreams.filter(d=>d.lucid).length;
  const week = dreams.filter(d=>new Date(d.created_at)>new Date(Date.now()-7*86400000)).length;
  const vvs = dreams.filter(d=>d.vividness>0);
  const avgV = vvs.length ? (vvs.reduce((a,d)=>a+d.vividness,0)/vvs.length).toFixed(1) : '—';
  
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat-box"><div class="stat-num">${lucid}</div><div class="stat-label">Lucid</div></div>
    <div class="stat-box"><div class="stat-num">${total?Math.round(lucid/total*100):0}%</div><div class="stat-label">Lucid %</div></div>
    <div class="stat-box"><div class="stat-num">${week}</div><div class="stat-label">7 days</div></div>
  `;
  
  const list = document.getElementById('dream-list');
  if (!dreams.length) { list.innerHTML='<p style="color:#4a4660;text-align:center;padding:3rem">No dreams yet 🌙</p>'; return; }
  
  list.innerHTML = dreams.map(d => {
    const date = new Date(d.created_at);
    const ds = date.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})+' '+date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    let badges='';
    if (d.lucid) badges+='<span class="lucid-badge">LUCID</span>';
    if (d.dream_type==='fragment') badges+='<span class="fragment-badge">fragment</span>';
    if (d.vividness>0) badges+=`<span class="viv-badge">${'●'.repeat(d.vividness)}${'○'.repeat(5-d.vividness)}</span>`;
    const tags = d.tags?`<div class="dream-tags">${d.tags.split(',').map(t=>'#'+t.trim()).join(' ')}</div>`:'';
    const supps = d.supplements?`<div class="dream-supps">💊 ${d.supplements}</div>`:'';
    return `<div class="dream-card" id="d-${d.id}">
      <div class="dream-date">${ds} ${badges}</div>
      <div class="dream-text">${esc(d.content)}</div>
      ${tags}${supps}
      <div class="dream-actions">
        <button onclick="deleteDream(${d.id})">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function showCapture() {
  document.getElementById('timeline-view').style.display='none';
  document.getElementById('capture-view').style.display='flex';
  document.getElementById('dream-input').focus();
}

function deleteDream(id) {
  if (!confirm('Delete?')) return;
  saveDreams(getDreams().filter(d=>d.id!==id));
  document.getElementById('d-'+id)?.remove();
}

function exportJSON() {
  const data = JSON.stringify(getDreams(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dreamlog_'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
}

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')saveDream();});
</script>
</body>
</html>
