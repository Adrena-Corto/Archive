title: "The Art of Gold: 3000 Years of Chinese Treasures"
author: "L'École, School of Jewelry Arts"
publisher: "L'École Asia Pacific"
year: 2020
isbn: "Exhibition Catalog"
pages: 120
description: "Exhibition catalog showcasing 55 extraordinary gold jewelry pieces and ornaments from the Mengdiexuan Collection, illustrating over three thousand years of goldsmithing in China through four major techniques: hammering and chasing, casting, granulation, wire and filigree. Features necklaces, earrings, hairpins, bracelets, brooches and belt plaques from the Shang to the Qing Dynasties."
