title: "7000 Years of Jewellery"
author: "Hugh Tait (Editor)"
publisher: "British Museum Press"
year: 2006
isbn: "978-0714150321"
pages: 256
description: "A comprehensive guide to the history of jewels, exploring the varied styles, techniques and materials used to make jewellery throughout the world since earliest times. Egyptian necklaces, Celtic torcs, South American gold masks, Renaissance pendants and Art Nouveau buckles are among the range of masterpieces described by a team of experts from the British Museum and illustrated with 400 superb photographs."
