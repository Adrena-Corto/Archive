description: "Updated to mark the opening of the spectacular Jewellery Gallery at the V&A in May 2008, this book features exquisite early medieval pieces and superb examples of jewellery design from the Renaissance to the present. Outstanding photographs illustrate rare precious stones and elaborate techniques such as chasing, enameling, and cameo. Chronicles the development of Western jewelry over the last 500 years."
