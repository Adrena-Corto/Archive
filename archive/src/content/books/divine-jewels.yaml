description: "A stunning 520-page volume showcasing the jewelry collection of Kazumi Arikawa, founder and president of Albion Art. Features 250 treasured pieces with artistic and historical value, including royal European jewels and the largest collection of historical tiaras. For Arikawa, who spent time as a Buddhist monk, jewelry represents a spiritual pursuit and celebration of universal beauty. Co-authored with jewelry historian Diana Scarisbrick."
