description: "An international survey showcasing rings across history. The work presents rings through major signets; rings associated with love, marriage, and friendship; devotional, protective, and ecclesiastical rings; memento mori and memorial rings; and decorative varieties spanning ancient Egypt through the twentieth century. Features 479 full-color photographs from major museums and private collections."
