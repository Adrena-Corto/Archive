title: "Handbook of Ancient Greek and Roman Coins"
author: "Zander H. Klawans"
publisher: "Whitman Publishing"
year: 2020
isbn: "978-0307093622"
pages: 288
description: "A comprehensive handbook covering every aspect of ancient coinage, from how the pieces were made to what their symbolism meant. Combines two primary references for collectors: 'Reading and dating Roman imperial coins' and 'An Outline of ancient Greek coins.' Features data, charts, and over 1000 full-size photographs showing how to read inscriptions, identify emperors and dates, symbols, city names, and mythological characters."
