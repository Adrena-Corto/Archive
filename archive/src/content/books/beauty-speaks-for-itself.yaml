description: "Exhibition catalog featuring over 260 masterworks from the National Palace Museum, Paris' Musée des Arts Décoratifs, and Van Cleef & Arpels. Inspired by philosopher Zhuangzi's ancient wisdom, the exhibition showcases ceramics, jades, glass, bronze, silver and gold, graphic art, sculpture, textile, furniture, high jewelry, and luxury watchmaking creations across five sections: nature, movement, fantasy, secrets, and colors."
