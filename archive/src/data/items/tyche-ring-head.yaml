description: "Bronze ring bezel depicting Tyche, the Greek goddess of fortune and prosperity, standing facing right. She holds a cornucopia in one arm, symbolizing abundance, and a grain ear in her other hand, representing agricultural fertility. The figure is rendered in low relief with drapery indicated by fine lines. Tyche was one of the most popular deities in the Hellenistic world, serving as the divine protector of cities and bestower of good fortune. This bezel would have been set into a ring band, worn as a personal talisman."
