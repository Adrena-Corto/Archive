condition: "Fragment - foot plate preserved, pin mechanism lost"
description: "Fragment of a Roman bronze fibula (brooch), preserving the decorated foot plate. The plate features a distinctive design with five circular bosses arranged in a quincunx pattern, each boss with a central dot surrounded by concentric circles. Additional circular motifs decorate the narrow section leading to what would have been the spring mechanism. This style of disc-decorated fibula was common in Roman Gaul during the Imperial period. Self-found while metal detecting in Arras, an area with significant Roman activity as Nemetacum, capital of the Atrebates tribe."
