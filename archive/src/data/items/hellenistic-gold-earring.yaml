description: "Exquisite gold earring featuring an amphora or teardrop-shaped pendant decorated with elaborate granulation work. The surface displays intricate patterns created by rows of tiny gold beads (granules) soldered onto a sheet gold body, forming chevron and curvilinear designs. The granulation technique was mastered by Greek and Etruscan goldsmiths and represents one of the most technically demanding forms of ancient metalwork. A simple wire loop attached at the narrow end allowed the earring to be worn through the ear. The sophisticated craftsmanship and refined aesthetic are characteristic of Hellenistic jewelry production."
