description: "Terracotta head of a young woman, likely from a larger votive figurine. The face displays idealized Hellenistic features with full cheeks, small mouth, and wavy hair parted in the center and swept back. The hair is rendered with incised lines radiating from the part. The back is hollow, showing this was mold-made as was typical of mass-produced terracotta figurines. Such figures were common dedications at sanctuaries throughout the Greek world, representing worshippers, deities, or attendants."
