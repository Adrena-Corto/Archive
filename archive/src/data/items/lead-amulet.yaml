description: "Circular lead amulet with suspension loop, inscribed on both faces. The obverse displays multiple horizontal registers filled with pseudo-script or magical characters, possibly Greek vowel sequences or charaktêres (magical signs) commonly found on Byzantine apotropaic objects. The reverse shows two intertwined serpents or a similar protective motif. Such lead amulets were worn for protection against illness, the evil eye, or malevolent spirits. The use of lead, associated with binding magic, and the dense inscriptions suggest this served as a powerful protective talisman."
