id: roman-agate-seal
name: "Roman Banded Agate Seal with Bull"
category: seal
era: "c. 100 BCE - 200 CE"
period: "Roman"
origin: "Roman Empire"
material: agate
weight: "5.85g"
dimensions: "17.6mm diameter"
condition: "Good - some surface wear, intaglio well preserved"
description: "Banded agate seal stone carved with an intaglio of a bull in profile, depicted standing or walking. The stone displays attractive natural banding in shades of red, orange, white and brown typical of carnelian agate. The convex back is drilled through, likely for mounting in a swivel ring setting where a metal pin would pass through allowing the stone to rotate between the decorative back and the seal face. Bulls were powerful symbols in Roman art representing strength, fertility, and sacrifice."
