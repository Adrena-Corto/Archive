description: "Sasanian green stone stamp seal depicting a bearded man facing right with highly stylised facial features and clothing. The figure shows characteristic Sasanian artistic conventions with linear rendering of the beard and garments. The seal has a flat oval body with a horizontally drilled suspension hole. Such personal seals were used throughout the Sasanian Empire to authenticate documents and mark property, with the owner's image or symbol pressed into clay or wax."
